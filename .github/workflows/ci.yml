name: ci
# Lint + test + arm64 image. The job named `ci` is the single required status check on main.
# On an agent PR (branch claude/*) failure: post an @claude retry as kiu-homie-bot (max 2 rounds),
# then label needs-human.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod}
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: kustomize build deploy/
        run: kubectl kustomize deploy > /dev/null

  image:
    needs: test
    # Never for fork PRs (no secrets, read-only token).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tag = git commit SHA: Argo CD deploys <repo>:<sha> for main (prod) and PR heads (previews).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: VERSION=${{ github.event.pull_request.head.sha || github.sha }}
          tags: ghcr.io/${{ github.repository }}:${{ github.event.pull_request.head.sha || github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci:
    if: always()
    needs: [test, image]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: aggregate
        env:
          TEST: ${{ needs.test.result }}
          IMAGE: ${{ needs.image.result }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "test=$TEST image=$IMAGE fork=$FORK"
          [ "$TEST" = success ] || exit 1
          [ "$IMAGE" = success ] || { [ "$FORK" = true ] && [ "$IMAGE" = skipped ]; } || exit 1

  fix-round:
    needs: ci
    if: >-
      failure() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      !contains(github.event.pull_request.labels.*.name, 'hold') &&
      !contains(github.event.pull_request.labels.*.name, 'needs-human')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      actions: read
    steps:
      - id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.KIU_HOMIE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.KIU_HOMIE_BOT_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write
      - name: log excerpt (GITHUB_TOKEN, actions:read)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The run is still in progress, so read the logs of its finished, failed jobs directly.
          for id in $(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}/jobs" --jq '.jobs[] | select(.conclusion=="failure") | .id'); do
            gh api "repos/$GH_REPO/actions/jobs/$id/logs" 2>/dev/null | sed 's/^[0-9T:.-]*Z //' | grep -v '^##\[group\]' | cut -c1-300 | tail -n 60
          done > excerpt.txt || true
          [ -s excerpt.txt ] || echo "(no log excerpt available)" > excerpt.txt
      - name: retry as kiu-homie-bot, or escalate
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case ",$LABELS," in
            *,fix-round-2,*) round=3 ;;
            *,fix-round-1,*) round=2 ;;
            *) round=1 ;;
          esac
          if [ "$round" -gt 2 ]; then
            gh pr edit "$PR" --add-label needs-human
            gh pr comment "$PR" --body "CI failed after 2 fix rounds — handing over to a human. Run: $RUN_URL"
            exit 0
          fi
          gh pr edit "$PR" --add-label "fix-round-$round"
          {
            echo "@claude CI failed on this PR (fix round $round of 2). Read the failure, fix the code, keep the change in scope, and push to this branch."
            echo; echo "Run: $RUN_URL"; echo; echo '```'; cat excerpt.txt; echo '```'
          } > body.md
          gh pr comment "$PR" --body-file body.md
