# Tailnet-only (Tailscale operator). Host is set by Argo CD: <repo> for prod, pr-<n>-<repo> for previews.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
spec:
  ingressClassName: tailscale
  defaultBackend:
    service: {name: app, port: {number: 80}}
  tls:
    - hosts: [app]
